apiVersion: v1
kind: Pod
metadata:
  name: cpu-waiter
  namespace: hh-lab
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: sleeper
      image: "hh-pairs:lab"
      imagePullPolicy: IfNotPresent
      command: ["python3", "-c", "import time; time.sleep(3600)"]
      resources:
        requests:
          cpu: "2"
          memory: "32Mi"
        limits:
          cpu: "2"
          memory: "128Mi"
