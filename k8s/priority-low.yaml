apiVersion: v1
kind: Pod
metadata:
  name: priority-low
  namespace: hh-lab
  labels:
    experiment: preemption
spec:
  priorityClassName: hh-lab-low
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: sleeper
      image: hh-pairs:lab
      imagePullPolicy: IfNotPresent
      command: ["python3", "-c", "import time; time.sleep(3600)"]
      resources:
        requests:
          cpu: "6"
          memory: "32Mi"
        limits:
          cpu: "6"
          memory: "128Mi"
