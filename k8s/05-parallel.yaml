apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-parallel
  namespace: hh-lab
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: hh-pairs:lab
          imagePullPolicy: Never
          args:
            - count
            - --input
            - s3://hh-lake/parts/part-{index}.jsonl
            - --output
            - s3://hh-lake/results/parts/part-{index}.csv
          env:
            - name: S3_ENDPOINT
              value: http://rustfs:9000
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
